# Development overrides — use with:
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - "python"
      - "-m"
      - "uvicorn"
      - "app.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--reload"
      - "--log-level"
      - "debug"
    volumes:
      - ./backend/app:/app/app
      # Mount your entire D drive so Docker can read manga folders
      - /d:/mnt/d
      - /c:/mnt/c
    environment:
      - DEBUG=true
