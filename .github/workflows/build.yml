name: Build

on:
  push:
    branches: [main, dev]

jobs:
  build:
    name: Build Electron + Python Bundle
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # ─── Python backend → PyInstaller ────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Package backend with PyInstaller
        working-directory: backend
        run: |
          pyinstaller manga_backend.spec --noconfirm

      # ─── Electron frontend ───────────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React app
        working-directory: frontend
        run: npm run build

      - name: Package Electron app
        working-directory: frontend
        run: npm run electron:build
        env:
          # Tell electron-builder where the bundled backend lives
          BACKEND_DIST: ../backend/dist/manga_backend

      # ─── Upload artifacts for inspection ─────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: manga-translator-win-${{ github.sha }}
          path: frontend/release/*.exe
          retention-days: 7