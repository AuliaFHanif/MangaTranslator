services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: manga-backend
    ports:
      - "8000:8000"
    volumes:
      - manga-models:/app/models
      - manga-projects:/app/projects
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=true
      - LMSTUDIO_HOST=host.docker.internal
      - LMSTUDIO_PORT=1234
      - MAX_CONCURRENT_PAGES=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  manga-models:
    driver: local
  manga-projects:
    driver: local